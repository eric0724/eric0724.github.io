    <script>
        function showCustomConfirm(message, onConfirm, onCancel) {
            // 創建遮罩層
            const overlay = document.createElement("div");
            overlay.style.position = "fixed";
            overlay.style.top = "0";
            overlay.style.left = "0";
            overlay.style.width = "100%";
            overlay.style.height = "100%";
            overlay.style.backgroundColor = "rgba(0,0,0,0.5)";
            overlay.style.display = "flex";
            overlay.style.justifyContent = "center";
            overlay.style.alignItems = "center";
            overlay.style.zIndex = "9999";

            // 創建對話框
            const dialog = document.createElement("div");
            dialog.style.backgroundColor = "#fff";
            dialog.style.padding = "20px 30px";
            dialog.style.borderRadius = "10px";
            dialog.style.textAlign = "center";
            dialog.style.minWidth = "300px";
            dialog.style.boxShadow = "0 5px 15px rgba(0,0,0,0.3)";
            dialog.style.position = "relative"; // 為了方便定位小字

            // 小提示文字
            const tip = document.createElement("div");
            tip.innerText = "此視窗是 AI 做的";
            tip.style.fontSize = "12px";
            tip.style.color = "#888";
            tip.style.position = "absolute";
            tip.style.top = "5px";
            tip.style.right = "10px";
            dialog.appendChild(tip);

            // 文字訊息
            const msg = document.createElement("p");
            msg.innerText = message;
            msg.style.marginBottom = "20px";
            msg.style.fontSize = "16px";
            dialog.appendChild(msg);

            // 按鈕容器
            const btnContainer = document.createElement("div");
            btnContainer.style.display = "flex";
            btnContainer.style.justifyContent = "space-around";

            // 確定按鈕
            const okBtn = document.createElement("button");
            okBtn.innerText = "確定";
            okBtn.style.padding = "8px 20px";
            okBtn.style.backgroundColor = "#4CAF50";
            okBtn.style.color = "#fff";
            okBtn.style.border = "none";
            okBtn.style.borderRadius = "5px";
            okBtn.style.cursor = "pointer";
            okBtn.onclick = () => {
                document.body.removeChild(overlay);
                if (onConfirm) onConfirm();
            };

            // 拒絕按鈕
            const cancelBtn = document.createElement("button");
            cancelBtn.innerText = "拒絕";
            cancelBtn.style.padding = "8px 20px";
            cancelBtn.style.backgroundColor = "#f44336";
            cancelBtn.style.color = "#fff";
            cancelBtn.style.border = "none";
            cancelBtn.style.borderRadius = "5px";
            cancelBtn.style.cursor = "pointer";
            cancelBtn.onclick = () => {
                document.body.removeChild(overlay);
                if (onCancel) onCancel();
            };

            btnContainer.appendChild(okBtn);
            btnContainer.appendChild(cancelBtn);
            dialog.appendChild(btnContainer);
            overlay.appendChild(dialog);
            document.body.appendChild(overlay);
        }

        });

        //-----------------------退出房間--------------------------------------
        async function Exit_the_room(){
            var snapshot = await firebase.database().ref("groups/" + Global_room_name + "/buys")
                .orderByChild("uid").equalTo(Global_userid)
                .once("value");
            const removes = [];
            if (snapshot.exists()) {
                snapshot.forEach(childSnap => {
                    const key = childSnap.key;
                    removes.push(firebase.database().ref("groups/" + Global_room_name + "/buys/" + key).remove());
                });
            }
            // 等所有刪除完成
            await Promise.all(removes);
            await add_room_name_new();
            await firebase.database().ref("usernames/" + Global_userid + "/roomname").set(Global_room_name)
            await firebase.database().ref("usernames/" + Global_userid + "/Permissions").set("Admin")
            document.getElementById("Together_button").textContent = "共同建立"
            re_upbutton()
            test()
        }
        //------------------------更改房客 權限------------------------------------------
        function edit_Permissions_onchange(changeValue)
        {
            var B_colr = document.getElementById("Together_button").style.backgroundColor
            if( B_colr != "orange"){
                alert("你不是房組，無法修改")
                return
            }
            var input2 = document.getElementById("input2_input_user").value;
            firebase.database().ref("usernames/" + input2 + "/Permissions").set(changeValue) // 將數量加 1
        }
        //------------------------選擇後 名字 顯示他的 權限-------------------------------
        function edit_Permissions_name_onchange(changeValue)
        {
            firebase.database().ref("usernames/" + changeValue + "/Permissions")
                .once("value")
                .then(snapshot => {
                    var permission = snapshot.val(); // "User" 或 "Admin"
                    document.getElementById("input2_Permissions").value = permission;
                });
        }
        //-------------------------------------------------------------------------------
        //------------------------找出房內 所有 名字--------------------------------------
        async function inRoom_nameS(){
            var snapshot = await firebase.database().ref("usernames/").once("value");
            const childrenData = [];
            snapshot.forEach(childSnap => {
                childrenData.push({
                    key: childSnap.key,
                    val: childSnap.val()
                });
            });
            for (const childSnap of childrenData) {
                try {
                    const uidi = childSnap.key;
                    const data = childSnap.val;
                    let name = await getName(uidi);
                    if (!name) name = uidi;
                    if(typeof name != "string" || name.startsWith("Group_buy_use_user")){
                        continue
                    }
                    if( data.roomname == Global_room_name){
                        if (!room_userNames.some(u => u.uid === uidi)) 
                        {
                            room_userNames.push({ username: name, uid: uidi });
                        }
                    }
                } catch(e) {
                    alert("(inroom)Error in loop: " + e);
                }
            }
        }
        //------------------------列出 名字 清單------------------------------------------
        async function edit_Permissions_username()
        {
            await inRoom_nameS()
            // 更新 <select>
            var select = document.getElementById("input2_input_user");
            select.innerHTML = "";
            room_userNames.forEach(u => {
                var option = document.createElement("option");
                option.value = u.uid;       // value 儲存 uid
                option.textContent = u.username; // 顯示 username
                select.appendChild(option);
            });

        }
        function copyLink(){
            var roomName = Global_room_name;
            var roomPass = Global_room_pass;
            //roomName = "合買群A";
            //roomPass = "合買群A";
            var link = location.origin + location.pathname +

                "&pass=" + encodeURIComponent(roomPass);

            navigator.clipboard.writeText(link);
            alert("已複製邀請連結");
        }

        var snapshot = await firebase.database()
            .ref("groups/" + group_name + "/buys")
            .orderByChild("uid").equalTo(uid)
            .once("value");

        let name = "";
        snapshot.forEach(childSnap => {
            name = childSnap.val().username;
        });
        return name;
    }
    //---------------------_____-存檔_____--------------------
    async function fire_add(buy_name,quantityi,money,cur,discounti,inputn){
        localStorage.setItem("account", Global_userid);
        localStorage.setItem("password", Global_userpass);
        localStorage.setItem("local_roomName", Global_room_name);
        localStorage.setItem("local_roomPass", Global_room_pass);
        userid = document.getElementById("logIn_button").textContent
        if (userid == "帳號") userid = Global_userid
        group_name = document.getElementById("Together_button").textContent
        if (group_name == "共同建立") {
            group_name = Global_room_name
            firebase.database().ref("rooms/" + group_name).set(group_name);
            firebase.database().ref("usernames/" + userid + "/pass").set(Global_userpass);
            firebase.database().ref("usernames/" + userid + "/roomname").set(group_name) // 將數量加 1
        }
        //------------------如果 合買將增加一個 uid---------------------------------
        //#region
        var have_Group_buy_use_uid = false
        var snapshots = await firebase.database().ref("usernames/")
                                .orderByChild("roomname").equalTo(Global_room_name)
                                .once("value") ;
        var Group_buy_use_user = ""
        snapshots.forEach(childSnap => {
            var uid = childSnap.key    
            var val = childSnap.val()
            // 是否字串前面有"Group_buy_use_user"
            if( uid.startsWith("Group_buy_use_user")){ 
                have_Group_buy_use_uid = true
                Group_buy_use_user = uid
            }
        });
        if(!have_Group_buy_use_uid){
            var n = 0
            while(await fcheck_UidExists("Group_buy_use_user" + n)){
                n += 1
            }
            Group_buy_use_user = "Group_buy_use_user" + n
            firebase.database().ref("usernames/" + Group_buy_use_user + "/roomname").set(Global_room_name);
        }
        //#endregion
        //------------------------------------------------------------------------
        
        var name = await getName(userid) 
        if (name == null||name == "") name = userid
        const checkedBoxes = document.querySelectorAll(".input3_checkbox:checked");
        let newUser = {}
        if(inputn == "input3"){
            // 合買人
            const peopleS = [];
            checkedBoxes.forEach(box => {
                peopleS.push(box.value);
            });
            userid = Group_buy_use_user
            newUser = { uid:userid, username:peopleS, item:buy_name, 
                quantity:quantityi, price:money, currency:cur, discount:discounti,Group_buy:"T"};
        }
        else{
            newUser = { uid:userid, username:name, item:buy_name, 
                quantity:quantityi, price:money, currency:cur, discount:discounti,Group_buy:"F"};
        }
        
        const snapshot = await firebase.database()
                        .ref("groups/" + Global_room_name + "/buys")
                        .once("value");

        let found = false;
            var some_buyi = false
            snapshot.forEach(childSnap => {
                const key = childSnap.key;
                const data = childSnap.val();
                if (data.item === buy_name) {
                    if (data.uid === userid) {
                        alert("商品已存在，自動將商品數量加一")
                        found = true;
                        firebase.database()
                            .ref("groups/" + Global_room_name + "/buys/" + key + "/quantity")
                            .set(Number(data.quantity) + 1);
                    }
                    else{
                        some_buyi =true
                        //alert("以有其他人購買商品已存在，但本系統預設為分開計算")
                    }
                }
            });
        if(some_buyi) {
            alert("以有其他人購買商品已存在，但本系統預設為分開計算")
            some_buyi = false
        }
        // 沒找到相同商品才新增
        if (!found) {
            await firebase.database().ref("groups/" + group_name + "/buys").push(newUser);
        }
        if (Vlogout != null){
            await Vlogout.cancel(); // 取消訪客模式自動刪除
            Vlogout = null;
        }
        test()
    }

        var f_usernames =  await firebase.database().ref("groups/" + Global_room_name + "/buys")
